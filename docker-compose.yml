services:
  minio:
    image: quay.io/minio/minio:RELEASE.2022-10-15T19-57-03Z
    container_name: rip-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin # Дефолты
    volumes:
      - minio-data:/data
      - ./config:/root/.minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
  postgres:
    image: postgres:latest
    container_name: rip-postgres-18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: rip
    ports:
      - "8082:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: rip-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
    name: minio_data_volume
  postgres_data:
    name: rip-psgre-volume
